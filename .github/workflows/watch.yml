name: Bentley seat watcher

# GitHub's scheduled triggers are often delayed by 10-30 minutes, so instead of
# one cron per poll this starts a single long-lived job that polls internally on
# an exact interval. The cron just restarts it before the 6h job limit.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = poll for 5.5h; verify = one quick check that the runner still works"
        type: choice
        options: [watch, verify]
        default: watch

# Verify runs in its own group so a health check never cancels the live watcher.
concurrency:
  group: seat-watcher-${{ inputs.mode || 'watch' }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Verify proves three things end to end: the secret is readable, ntfy
      # accepts a push from the runner, and the listing is still parseable.
      # The dry run uses a throwaway state file so it can't eat a real alert.
      - name: Verify (push a test alert, then one silent poll)
        if: inputs.mode == 'verify'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 watcher.py --test-push
          python3 watcher.py --dry-run --state "$RUNNER_TEMP/verify.json"

      # Carry alert history between runs so a restart doesn't re-notify you
      # about a section you already saw.
      - name: Restore watcher state
        if: inputs.mode != 'verify'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: seat-state-${{ github.run_id }}
          restore-keys: seat-state-

      - name: Watch for open seats
        if: inputs.mode != 'verify'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watcher.py --loop --max-minutes 330

      - name: Save watcher state
        if: always() && inputs.mode != 'verify'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: seat-state-${{ github.run_id }}
